[project]
name = "hola-hello-ciao"
version = "0.1.0"
description = "Weather sensor metrics API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hola_hello_ciao"]

[tool.fastapi]
entrypoint = "hola_hello_ciao.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dev tooling (ADR-006) is not packaged; make it importable for tests/scripts/.
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts"]
